[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitproof"
version = "0.1.0"
description = "Turn a GitHub username into an evidence-backed developer profile and proof-of-work report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13.7", "httpx>=0.27", "jinja2>=3.1"]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8", "ruff>=0.5", "weasyprint>=62"]

[project.scripts]
gitproof = "gitproof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitproof"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501", "B904", "E741", "E731"]
